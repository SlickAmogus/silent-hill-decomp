apply plugin: 'com.android.application'

android {
    namespace 'com.silenthill.port'
    compileSdk 34
    ndkVersion '27.3.13750724'

    defaultConfig {
        applicationId 'com.silenthill.port'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '0.1-android'

        externalNativeBuild {
            cmake {
                // c++_shared: PsyCross is C++ and SDL2 links the STL too, so a
                // static STL would give each .so its own copy.
                arguments '-DANDROID_STL=c++_shared',
                          '-DCMAKE_BUILD_TYPE=RelWithDebInfo'
                // arm64 only for now: the Arcade1Up target board is a 64-bit
                // MT8163 BSP and the phone is arm64 as well. Adding
                // 'armeabi-v7a' here is the only change a 32-bit cabinet needs,
                // but it doubles native build time so it stays off until one
                // actually turns up.
                abiFilters 'arm64-v8a'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            // SDLActivity and its support classes are consumed straight from
            // the SDL submodule so they can never drift from the native SDL2
            // this links against.
            java.srcDirs += 'jni/SDL/android-project/app/src/main/java'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            // Sideloaded builds only; keeps `adb install -r` working without a
            // signing config of its own.
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
}
