apply plugin: 'com.android.application'

android {
    namespace 'com.silenthill.port'
    compileSdk 34
    ndkVersion '26.2.11394342'

    defaultConfig {
        applicationId 'com.silenthill.port'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '0.1-android'

        externalNativeBuild {
            cmake {
                // c++_shared: PsyCross is C++ and SDL2 links the STL too, so a
                // static STL would give each .so its own copy.
                arguments '-DANDROID_STL=c++_shared',
                          '-DCMAKE_BUILD_TYPE=RelWithDebInfo'
                // Both ABIs. arm64-v8a is the phone and any 64-bit Android build;
                // armeabi-v7a is there because plenty of MT8163 devices (the
                // Arcade1Up board) ship a 32-bit Android userspace on a 64-bit
                // capable chip, and a 64-bit-only APK simply refuses to install
                // there. Costs native build time; cheaper than finding out at
                // the cabinet. `adb shell getprop ro.product.cpu.abilist` on the
                // cabinet says which one it will actually use.
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            // SDLActivity and its support classes are consumed straight from
            // the SDL submodule so they can never drift from the native SDL2
            // this links against.
            java.srcDirs += 'jni/SDL/android-project/app/src/main/java'

            // The port's OWN runtime assets -- decal.png, the OFL-licensed
            // fonts, the language pack, UI sounds. All redistributable; none of
            // it comes off the disc. On desktop CMake copies this tree next to
            // the executable, so Android has to carry it some other way.
            // SilentHillActivity unpacks it to the external files dir at
            // startup, next to where the user's own BIN goes.
            // Relative paths here resolve against app/, not the project root,
            // so anchor on rootProject (android_port/) explicitly.
            assets.srcDirs += "${rootProject.projectDir}/../pc_port/assets"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            // Sideloaded builds only; keeps `adb install -r` working without a
            // signing config of its own.
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
}
