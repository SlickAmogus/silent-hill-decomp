# Add these keys to config.cfg to opt into a software SPU renderer.
# Existing configurations remain on the legacy OpenAL renderer.
# authentic: native/recommended 44.1 kHz
# high_precision: native/recommended 176.4 kHz
# modern: native 352.8 kHz; recommended output 176.4 or 352.8 kHz
spu_renderer = authentic
high_precision_clip = none
modern_clip = none
modern_dither = none
audio_backend = auto
audio_mode = shared
audio_rate = auto
audio_bit_perfect = 0
#audio_spatial = 1

# Renderer IDs: legacy=0, authentic=1, high_precision=2, modern=3.
# Old exact/ideal/reference names remain accepted as aliases.
# high_precision_clip/modern_clip: none, psx, soft
# modern_dither: none, tpdf
# audio_backend: auto, wasapi, sdl
# audio_mode: shared, exclusive
# audio_rate: auto, 44100, 88200, 176400, 352800
#
# audio_spatial: place the software SPU voices through OpenAL instead of
# downmixing them to stereo. This is what gets a surround layout its channels,
# and it is the only path where the real PSX reverb reaches them.
#
# You normally do not need to set it: naming a layout with audio_output
# (quad, 51, 71 or hrtf) turns it on. hrtf counts because it is binaural
# placement, so without this it is just a stereo downmix. Set it to 0 to force
# the plain stereo sink anyway, or to 1 to place voices on stereo and auto too.

