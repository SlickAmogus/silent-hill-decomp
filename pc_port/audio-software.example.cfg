# Add these keys to config.cfg to opt into a software SPU renderer.
# Existing configurations remain on the legacy OpenAL renderer.
spu_renderer = exact
ideal_clip = none
reference_clip = none
reference_dither = none
audio_backend = auto
audio_mode = shared
audio_rate = auto
audio_bit_perfect = 0

# Renderer IDs: legacy=0, exact=1, ideal=2, reference=3.
# Valid renderer strings are legacy, exact, ideal, and reference.
# ideal_clip/reference_clip: none, psx, soft
# reference_dither: none, tpdf
# audio_backend: auto, wasapi, sdl
# audio_mode: shared, exclusive
# audio_rate: auto, 44100, 88200, 176400, 352800
