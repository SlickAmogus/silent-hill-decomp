# Silent Hill PC Port Configuration
# Lines starting with # are comments

# Rendering resolution
width = 640
height = 480

# Display mode (0 = windowed, 1 = exclusive fullscreen, 2 = borderless)
fullscreen = 0

# VSync (0 = off/uncapped, 1 = on, -1 = adaptive vsync)
vsync = 0

# Target refresh rate in hz (0 = display default). Only applies in fullscreen mode.
# Set to your monitor's refresh rate (e.g. 60, 144, 240) combined with vsync = 1.
refresh_rate = 0

# Gameplay FPS cap (0 = uncapped, 30 = PSX-accurate, 60 = smooth).
# The PSX ran at 30fps (2 vblanks/frame). Set to 0 for uncapped or 60 for 60fps.
# Toggle at runtime with numpad 0. Game physics use real elapsed time so any cap is safe.
fps_cap = 30

# Disable aggressive PSX view culling.
#   1 = render all objects (recommended, default) ??? prevents fences/trees and
#       other geometry from popping in and out as the camera turns.
#   0 = original PSX culling behavior (objects culled by view angle/position).
disable_culling = 1

# Preload all IPD chunks at map init (0 = PSX streaming, 1 = load all at once)
# The PSX streams 2-4 chunks from CD as the player moves. On PC, we can load
# all chunks for the entire map at once, eliminating streaming delays and
# ensuring all geometry is always available.
preload_chunks = 1

# Skip intro logos and opening movie (0 = show logos+movie, 1 = go straight to main menu)
skip_intros = 0

# Show the secondary console window alongside the game window (0 = hidden,
# 1 = visible). When on, lines emitted via SH_DBG_ECHO (e.g. [AIM-KF])
# also stream to that console in real time. SilentHill.log keeps getting
# written either way.
show_console = 0

# Texture filtering mode:
#   0 = off       (sharp PSX-style point sampling, exposes texture-page seams)
#   1 = dither    (PSX 4x4 ordered dither + 5-bit quantize ??? authentic look,
#                  masks page seams as noise, recommended)
#   2 = bilinear  (modern smooth filtering ??? softer textures, no seams,
#                  but loses the PSX aesthetic)
# Default is 1 (dither). Configurable from the launcher's "Filtering" dropdown.
psx_dither = 1

# Widescreen presentation mode (only matters on 16:9 / wider displays).
#   0 = Pillarbox  ??? render 4:3 PSX content centered, black bars on sides.
#                    Characters, scene framing, and FOV match PSX CRT exactly.
#   1 = Hor+       ??? default. Widen FOV horizontally so geometry beyond the
#                    original PSX framebuffer edges becomes visible (no
#                    stretching, characters at correct proportions). Fixed-cam
#                    shots use per-camera tuning in s_camCorrections[] to keep
#                    Harry framed like the original where it matters.
#   2 = Stretch    ??? anamorphic stretch of 4:3 content to fill 16:9 (chars
#                    appear ~33% wider; included for compatibility, not
#                    recommended).
widescreen_mode = 1

# Pillarbox 2D screens (menus, save/load, the Harry-running load screen) with
# 4:3 black bars instead of stretching the 4:3 art to fill a widescreen window.
# Only has any effect on widescreen (16:9 / wider) displays; on a 4:3 window
# there are no bars either way. Only affects 2D UI; 3D gameplay uses
# widescreen_mode above.
#   1 = pillarbox (4:3 centered, black bars ??? recommended, default)
#   0 = stretch to fill
menu_pillarbox = 1

# Use PGXP ??? sub-pixel-precision GTE vertex coords + perspective-correct
# texture mapping. With PGXP off (default), textures wobble/swim on tilted
# polygons (the classic PSX look). With PGXP on, textures stay locked and
# distant geometry doesn't jitter. WORK IN PROGRESS ??? turn on at your own
# risk; expect rendering glitches until all prim emit sites are migrated
# to populate the high-precision a_zw attribute.
use_pgxp = 0

# Antialiasing (MSAA) on the 3D world. Smooths polygon edges; textures, dither
# and 2D UI stay pixel-sharp. 0 = off, 2 / 4 / 8 = sample count (higher = smoother
# but costlier). Falls back to off automatically if the GPU can't provide it.
msaa = 0

# Full-screen post-process look applied to the final image. Cycle in-game with F2.
#   0 = Off          5 = Film Grain
#   1 = CRT          6 = Sharpen
#   2 = Scanlines    7 = PSX Retro (downsample + dither)
#   3 = Vignette     8 = Cinematic (color grade + vignette + grain)
#   4 = Color Grade
post_process = 0

# Tone mapping operator on the final image. Cycle in-game with F3.
#   0 = Off   1 = Reinhard   2 = ACES   3 = Filmic
tonemap = 0

# Per-pixel (fragment-shader) flashlight cone instead of the PSX per-vertex
# lighting. Toggle in-game with F4. 0 = off (PSX-accurate), 1 = per-pixel.
per_pixel_flashlight = 0

# Real-time flashlight shadows (monsters/props cast dynamic shadows inside the
# per-pixel beam). Only visible when per_pixel_flashlight is on. Toggle in-game
# under PC Options -> "PP Shadows". Debug console tweaks: `shadows 0/1`,
# `shadowstrength <f>` (1 = full/default, lower = softer), `shadowfade <f>`
# (0 = off; >0 fades a prop's shadow out that many units behind it, so it reads as
# a contact shadow instead of a projected silhouette), `shadownormal <f>`,
# `shadowbias <f>`. 1 = on (default), 0 = off.
flashlight_shadows = 1

# Effect intensities. Adjust in-game with [ and ] ( \ switches which enabled
# effect is being adjusted); also settable via console (flintensity / postintensity
# / tmintensity). Saved here automatically when changed in-game.
#   flashlight_intensity   : per-pixel flashlight cone brightness scale (0..3, 1 = normal)
#   flashlight_size        : per-pixel flashlight cone coverage multiplier (0..3)
#   flashlight_*_fps       : separate brightness/size used in first-person camera mode
#                            (head-mounted light: tighter + as bright)
#   post_process_intensity : post-process effect mix (0..1, 1 = full effect)
#   tonemap_intensity      : tone-map mix (0..1, 1 = full tone-map)
flashlight_intensity = 2.10
flashlight_size = 2.40
flashlight_intensity_fps = 2.10
flashlight_size_fps = 1.30
post_process_intensity = 1.0
tonemap_intensity = 1.0

# Allow loose files for texture mods (0 = disc image only, 1 = enable mod folder).
# When enabled, the game scans gamedata/load/{FOLDER}/{NAME}.{EXT} for replacement
# files mirroring the disc's directory layout (e.g. gamedata/load/BG/ER_AQSH1.TIM).
# If a loose file exists for a requested asset, it is loaded instead of the
# corresponding sector range from the .bin disc image. Falls through to CD read
# when no override is present. Adds one fopen() probe per file load.
allow_loose_files = 0

# Enable verbose SH_DBG logging to SilentHill.log (0 = silent, 1 = full).
# Default off so the log stays clean during normal play. Flip to 1 when
# investigating an issue and the SH_DBG calls scattered through the code
# will start dumping. They short-circuit to no-ops when this is 0, so
# leaving them in the tree costs almost nothing.
enable_debug_log = 0

# ===========================================================================
# CONTROLS
# ===========================================================================
# Keyboard and controller are independent ??? both are always active and can be
# bound separately. (Edit via the launcher's Controls window, or by hand here.)

# Enable developer / cheat keys: numpad debug camera, top-row give-weapon
# cheats, kill-Harry, noclip, console (~), collision visualizer (').
# 0 = off (default), 1 = on.
allow_debug_controls = 0

# Unlimited enemies: raise the per-room concurrent-enemy cap so natural spawns
# (and the console SPAWN command) can fill every slot, up to the PC hard limit of
# 32. 0 = off (original balance, default), 1 = on. Console: `unlimited 1`.
unlimited_enemies = 0

# Controller movement source: analog (left stick), dpad, or both (default).
controller_movement = both

# 1 = original PSX movement state machine (acceleration, wall smack, authored
# sidesteps/stumbles, analog pressure walking) - the default. 0 = legacy PC
# movement shim (kept for the debug TPS camera and as a fallback).
movement_original = 1

# Two control schemes are stored. The CLASSIC keys below apply with the default
# camera (tank controls / fixed angles). The ALTCAM keys further down (same names
# + an "_altcam" suffix) apply automatically whenever an alternate/modern camera
# (TPS or OTS) is active. Each scheme also has an alternate (second) bind per
# action. Edit via the launcher's Controls window or by hand.

# --- Keyboard bindings (CLASSIC: default camera) ---
# Values are SDL key names, e.g.: C  Z  Space  Return  Up  Down  "Left Shift"
# "Right Shift"  [  ]  Keypad 0 ... ("NONE" leaves the action unbound.)
key_up = Up
key_down = Down
key_left = Left
key_right = Right
# Cross = Action/Shoot, Circle = Flashlight, Triangle = Map, Square = Run
key_cross = C
key_circle = V
key_triangle = Z
key_square = X
# L1/R1 = sidestep, L2 = view, R2 = aim, L3/R3 = stick clicks
key_l1 = A
key_r1 = D
key_l2 = Right Shift
key_r2 = Left Shift
key_l3 = NONE
key_r3 = NONE
key_start = Return
key_select = Space
# Classic keyboard ALTERNATES (a second key/mouse per action) default unbound;
# the launcher manages key_up_2 ... key_select_2 (a key, Mouse1..Mouse5, or NONE).

# --- Controller bindings (CLASSIC: default camera) ---
# Values are SDL game-controller names: a b x y  leftshoulder rightshoulder
# lefttrigger righttrigger  leftstick rightstick  start back guide  ("NONE" =
# unbound). The d-pad and analog sticks are movement and are NOT rebindable.
pad_cross = a
pad_circle = b
pad_triangle = y
pad_square = x
pad_l1 = leftshoulder
pad_r1 = rightshoulder
pad_l2 = lefttrigger
pad_r2 = righttrigger
pad_l3 = leftstick
pad_r3 = rightstick
pad_start = start
pad_select = back
# Classic controller ALTERNATES default unbound; the launcher manages
# pad_cross_2 ... pad_select_2.

# --- Global hotkeys (apply in every camera mode) ---
# Quick Save / Quick Load (open the save/load screens during gameplay).
key_quicksave = F6
key_quickload = F8
# Change Camera: cycle the control style (Classic <-> TPS <-> OTS) in-game.
key_change_cam = F9
pad_change_cam = rightstick
# Swap the OTS shoulder side (a key or Mouse1..Mouse5); default middle mouse.
key_swap_shoulder = Mouse3
# Dev console toggle key (keyboard only; requires allow_debug_controls = 1). Default
# tilde "`"; rebind if your keyboard layout can't reach it. Hold to show/hide the
# console; tap while open to type a command.
key_console = `
# Graphics-effect tuning keys (keyboard only). key_gfx_cycle switches which
# enabled effect is being tuned (per-pixel flashlight / post-process / tonemap);
# key_gfx_prev / key_gfx_next lower / raise its intensity. Defaults \ / [ / ].
key_gfx_cycle = \
key_gfx_prev = [
key_gfx_next = ]

# ===========================================================================
# Alternate control styles (camera)
# ===========================================================================
# Active camera/control style. The game publishes the supported list to
# `control_styles` on launch; the launcher reads it for the Control Style dropdown.
control_style = classic
# Published by the game each launch (id:Label|...). Editing by hand has no effect.
control_styles = classic:Classic (Default)|tps:Thirdperson Shooter|ots:Over the Shoulder
# Invert the vertical look axis in TPS/OTS.
invert_mouse_y = 0
invert_controller_y = 0
# Zoom the TPS/OTS camera in behind Harry while aiming/attacking (1 = on).
tps_aim_zoom = 1
# Draw a center crosshair while aiming in TPS/OTS (1 = on).
crosshair = 0
# EXPERIMENT: in first-person, let the view direction follow Harry's animated
# head-bone rotation (idle sway / lean) with the mouse layered on top (1 = on).
immersive_fps_head_tracking = 0
# EXPERIMENT: 2D screen-relative movement for every camera except First Person
# (Classic fixed cameras + TPS/OTS). Input pushes Harry relative to the screen and
# he turns to face the pressed direction, instead of tank controls (1 = on).
control_2d = 0
# SPU ADSR envelopes: instrument attack/release fades in the sequenced BGM
# (1 = on, the PSX-correct sound). 0 = raw voices (pre-2026-07-06 behavior).
adsr = 1
# Reverb depth -> wet-level mapping scale. 0 = engine default (2.0). Raise if
# the music's echo is too dry vs the PSX, lower if too wet. Console: revscale.
reverb_scale = 0
# Look-speed multipliers for the TPS/OTS/FPS cameras (0.1 .. 4.0; 1.0 = default).
mouse_sensitivity = 1.0
controller_sensitivity = 1.0
# "Always use button based sprinting": walk by default, sprint ONLY while the
# bound Run control is held, like the classic scheme (1 = on). Applies to the
# alt cameras (TPS/OTS/FPS) and to 2D Controls under any camera. 0 = a
# near-full stick push also sprints.
altcam_button_sprint = 0

# ===========================================================================
# ALTCAM scheme — used automatically while an alternate/modern camera (TPS/OTS)
# is active. Same action keys as above with an "_altcam" suffix. Anything not
# listed defaults to unbound (NONE).
# ===========================================================================
# Keyboard: WASD move, A/D strafe, mouse fire (LMB) / aim (RMB), Shift run.
key_up_altcam = W
key_down_altcam = S
key_left_altcam = Left
key_right_altcam = Right
key_cross_altcam = Mouse1
key_circle_altcam = F
key_triangle_altcam = Tab
key_square_altcam = Left Shift
key_l1_altcam = A
key_r1_altcam = D
key_l2_altcam = NONE
key_r2_altcam = Mouse2
key_l3_altcam = NONE
key_r3_altcam = NONE
key_start_altcam = Return
key_select_altcam = Space
# Keyboard alternate: Action/Shoot also on E.
key_cross_2_altcam = E
# Controller: LT aim, RT fire, A = use/action (alternate), LB run; sidestep +
# view unbound.
pad_cross_altcam = righttrigger
pad_circle_altcam = b
pad_triangle_altcam = y
pad_square_altcam = leftshoulder
pad_l1_altcam = NONE
pad_r1_altcam = NONE
pad_l2_altcam = NONE
pad_r2_altcam = lefttrigger
pad_l3_altcam = leftstick
pad_r3_altcam = rightstick
pad_start_altcam = start
pad_select_altcam = back
# Controller alternate: Action/use also on A (Cross).
pad_cross_2_altcam = a

