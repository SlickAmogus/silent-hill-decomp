#   map1_s03  Midwich Elementary - 3F
#   map1_s04  Midwich Elementary - courtyard
#   map1_s05  Midwich Elementary - otherworld
#   map1_s06  Midwich Elementary - exterior (after)
#   map2_s00  Old Silent Hill - streets (after school)
