# Silent Hill PC Port Configuration
# Lines starting with # are comments

# Rendering resolution
width = 640
height = 480

# Fullscreen mode (0 = windowed, 1 = fullscreen)
fullscreen = 0

# VSync (0 = off/uncapped, 1 = on, -1 = adaptive vsync)
vsync = 0

# Target refresh rate in hz (0 = display default). Only applies in fullscreen mode.
# Set to your monitor's refresh rate (e.g. 60, 144, 240) combined with vsync = 1.
refresh_rate = 0

# Gameplay FPS cap (0 = uncapped, 30 = PSX-accurate, 60 = smooth).
# The PSX ran at 30fps (2 vblanks/frame). Set to 0 for uncapped or 60 for 60fps.
# Toggle at runtime with numpad 0. Game physics use real elapsed time so any cap is safe.
fps_cap = 30

# Disable aggressive PSX view culling (0 = original culling, 1 = render all objects)
# The original game aggressively culls objects based on view angle and position.
# Disabling culling prevents objects like fences and trees from popping in/out.
disable_culling = 1

# Preload all IPD chunks at map init (0 = PSX streaming, 1 = load all at once)
# The PSX streams 2-4 chunks from CD as the player moves. On PC, we can load
# all chunks for the entire map at once, eliminating streaming delays and
# ensuring all geometry is always available.
preload_chunks = 1

# Skip intro logos and opening movie (0 = show logos+movie, 1 = go straight to main menu)
skip_intros = 0

# Show the secondary console window alongside the game window (0 = hidden,
# 1 = visible). When on, lines emitted via SH_DBG_ECHO (e.g. [AIM-KF])
# also stream to that console in real time. SilentHill.log keeps getting
# written either way.
show_console = 0

# Texture filtering mode:
#   0 = off       (sharp PSX-style point sampling, exposes texture-page seams)
#   1 = dither    (PSX 4x4 ordered dither + 5-bit quantize — authentic look,
#                  masks page seams as noise, recommended)
#   2 = bilinear  (modern smooth filtering — softer textures, no seams,
#                  but loses the PSX aesthetic)
# Default is 1 (dither). Configurable from the launcher's "Filtering" dropdown.
psx_dither = 1

# 16:9 pixel-aspect compensation (only matters in widescreen rendering).
#   1 = CRT NTSC   (1.09375 ≈ 35:32) — matches a real PSX on a CRT TV (default)
#   2 = Square     (1.0)             — modern emulator look (DuckStation default)
#   3 = Wide 8:7   (1.143)           — alternative stretch some emulators use
# Affects horizontal scaling of all 3D content, including character proportions.
# The cull bounds (vw_calc.c, Gfx_MeshDraw) read the same value so geometry at
# the new edges doesn't get culled when you change this.
# Not exposed in the launcher — edit this file by hand to A/B test.
pixel_aspect = 1

# Use PGXP — sub-pixel-precision GTE vertex coords + perspective-correct
# texture mapping. With PGXP off (default), textures wobble/swim on tilted
# polygons (the classic PSX look). With PGXP on, textures stay locked and
# distant geometry doesn't jitter. WORK IN PROGRESS — turn on at your own
# risk; expect rendering glitches until all prim emit sites are migrated
# to populate the high-precision a_zw attribute.
use_pgxp = 0

# Allow loose files for texture mods (0 = disc image only, 1 = enable mod folder).
# When enabled, the game scans gamedata/load/{FOLDER}/{NAME}.{EXT} for replacement
# files mirroring the disc's directory layout (e.g. gamedata/load/BG/ER_AQSH1.TIM).
# If a loose file exists for a requested asset, it is loaded instead of the
# corresponding sector range from the .bin disc image. Falls through to CD read
# when no override is present. Adds one fopen() probe per file load.
allow_loose_files = 0

# Enable verbose SH_DBG logging to SilentHill.log (0 = silent, 1 = full).
# Default off so the log stays clean during normal play. Flip to 1 when
# investigating an issue and the SH_DBG calls scattered through the code
# will start dumping. They short-circuit to no-ops when this is 0, so
# leaving them in the tree costs almost nothing.
enable_debug_log = 0

