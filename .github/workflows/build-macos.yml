name: Build PC Port (macOS arm64)

# Produces the macOS arm64 binary of the PC port. CI only BUILDS it (the maintainer
# is still the sole publisher) — release-nightly.ps1 -AttachCrossPlatform pulls the
# artifact this run uploads and attaches it to the nightly release alongside the
# Windows build. The Windows launcher never consumes these files.
#
# macos-14 runners are Apple Silicon (arm64). The binary is UNSIGNED — Gatekeeper
# will warn; users right-click->Open once or run:
#   xattr -dr com.apple.quarantine .   (whole folder: binary + map .dylibs)

on:
  push:
    branches:
      - pc-port
    # Later patterns win: skip docs and the Windows launcher, but the macOS
    # launcher is part of this build.
    paths:
      - '**'
      - '!**.md'
      - '!pc_port/launcher/**'
      - 'pc_port/launcher/macos/**'
  workflow_dispatch:

jobs:
  build:
    if: github.repository == 'SlickAmogus/silent-hill-decomp'
    permissions:
      contents: write
    runs-on: macos-14

    steps:
      - name: Checkout (with PsyCross submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          # AppleClang can't compile the PSX decomp C; build.sh auto-selects
          # Homebrew GCC and points CMake at openal-soft + jpeg-turbo (both
          # keg-only, so build.sh passes their prefixes explicitly).
          # ffmpeg is a build-time header dependency only: the FMV fallback
          # dlopen's ffmpeg at runtime, so nothing is linked or bundled. The plain
          # formula (8.x) is not keg-only, so pkg-config finds it unaided.
          brew install gcc cmake ninja pkg-config sdl2 openal-soft jpeg-turbo ffmpeg

      - name: Build (build.sh -> Ninja + map .dylib overlays)
        run: |
          cd pc_port
          chmod +x build.sh
          ./build.sh

      - name: Stage release files
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/SHPC-macos-arm64"
          mkdir -p "$STAGE/maps"
          cp pc_port/build/SilentHillPC "$STAGE/"
          cp pc_port/build/maps/*.dylib "$STAGE/maps/"
          cp pc_port/config.cfg "$STAGE/config.cfg"
          mkdir -p "$STAGE/gamedata/save"
          # Shipped runtime assets (pc_port/assets/ mirrors the game folder layout).
          cp -r pc_port/assets/. "$STAGE/"

          # Bundle every Homebrew dylib the binary links (issue #110, then
          # openal-soft): they're linked by absolute /opt/homebrew paths, so users
          # without the matching `brew install` got "Library not loaded". Copy
          # each next to the binary and repoint its load command at @loader_path.
          BREW_DEPS="$(otool -L "$STAGE/SilentHillPC" | awk 'NR>1 && $1 ~ /^\/opt\/homebrew\//{print $1}')"
          for src in $BREW_DEPS; do
            base="$(basename "$src")"
            cp -L "$src" "$STAGE/$base"
            chmod u+w "$STAGE/$base"
            install_name_tool -change "$src" "@loader_path/$base" "$STAGE/SilentHillPC"
            install_name_tool -id "@loader_path/$base" "$STAGE/$base"
            echo "Bundled $base"
          done
          # Homebrew's sdl2 is sdl2-compat, which dlopen's SDL3 at runtime and
          # searches @loader_path/libSDL3.dylib first.
          if [ -f "$STAGE/libSDL2-2.0.0.dylib" ]; then
            cp -L "$(brew --prefix sdl3)/lib/libSDL3.0.dylib" "$STAGE/libSDL3.dylib"
            chmod u+w "$STAGE/libSDL3.dylib"
            install_name_tool -id "@loader_path/libSDL3.dylib" "$STAGE/libSDL3.dylib"
            echo "Bundled libSDL3.dylib for sdl2-compat"
          fi
          if otool -L "$STAGE/SilentHillPC" "$STAGE"/*.dylib "$STAGE"/maps/*.dylib | grep -q '/opt/homebrew/\|/usr/local/'; then
            echo "ERROR: Homebrew load paths remain after bundling:" >&2
            otool -L "$STAGE/SilentHillPC" "$STAGE"/*.dylib "$STAGE"/maps/*.dylib | grep '/opt/homebrew/\|/usr/local/' >&2
            exit 1
          fi

          # Ad-hoc codesign the binary and every .dylib (issue #110): unsigned
          # .dylibs made Gatekeeper prompt once PER map overlay ("cannot verify
          # developer", the four Done clicks). An ad-hoc signature plus the
          # recursive quarantine strip below lets them load without prompts.
          # Must run AFTER install_name_tool (editing a signed binary voids it).
          codesign --force --sign - "$STAGE/SilentHillPC" || true
          for dl in "$STAGE"/maps/*.dylib "$STAGE"/*.dylib; do
            [ -f "$dl" ] && codesign --force --sign - "$dl" || true
          done

          cat > "$STAGE/README-macos.txt" <<'EOF'
          Silent Hill PC Port — macOS arm64 (Apple Silicon)

          Requires the original disc image in gamedata/ (not included).

          SDL2, SDL3, OpenAL and libjpeg are bundled; no Homebrew install needed.

          The build is unsigned. Before the first run, clear the quarantine flag
          on the WHOLE folder so the binary AND the map .dylibs load without
          per-file Gatekeeper prompts:
            xattr -dr com.apple.quarantine .
          Then:  ./SilentHillPC
          EOF
          ( cd "$RUNNER_TEMP" && zip -r "$RUNNER_TEMP/SHPC-macos-arm64.zip" SHPC-macos-arm64 )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHPC-macos-arm64
          path: ${{ runner.temp }}/SHPC-macos-arm64.zip
          if-no-files-found: error
          retention-days: 90

      # Newest build on the `realtime` pre-release (one fixed name, replaced every
      # push) plus a dated copy on `realtime-history`, which keeps this platform's
      # newest 15. pc-port's tools/realtime_publish.py leaves both alone.
      - name: Publish to the realtime releases
        if: github.ref == 'refs/heads/pc-port'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SRC: ${{ runner.temp }}/SHPC-macos-arm64.zip
          FIXED: SHPC-macos-arm64.zip
          STEM: SHPC-macos-arm64
          EXT: .zip
          KEEP: 15
        run: |
          set -euo pipefail
          R="$GITHUB_REPOSITORY"
          # Linux/macOS already stage under the fixed name; cp refuses a self-copy.
          [ "$SRC" -ef "$RUNNER_TEMP/$FIXED" ] || cp "$SRC" "$RUNNER_TEMP/$FIXED"
          gh release upload realtime "$RUNNER_TEMP/$FIXED" --clobber --repo "$R"
          gh release view realtime-history --repo "$R" >/dev/null 2>&1 ||
            gh release create realtime-history --repo "$R" --prerelease --latest=false \
              --title "Realtime history (older builds)" --notes "Older automatic builds." || true
          DATED="${STEM}_$(date -u +%Y.%m.%d)-${GITHUB_SHA:0:9}${EXT}"
          cp "$SRC" "$RUNNER_TEMP/$DATED"
          gh release upload realtime-history "$RUNNER_TEMP/$DATED" --clobber --repo "$R"
          gh api "repos/$R/releases/tags/realtime-history" --jq \
            "[.assets[] | select(.name | startswith(\"${STEM}_\"))] | sort_by(.created_at) | reverse | .[${KEEP}:] | .[].name" |
            while read -r n; do gh release delete-asset realtime-history "$n" --repo "$R" --yes; done

      # Self-contained "Silent Hill PC.app" (SwiftUI launcher + game + bundled
      # Homebrew libs) on a drag-to-Applications disk image.
      - name: Build app bundle (.dmg)
        run: bash pc_port/launcher/macos/make_app.sh --dmg

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHPC-macos-arm64-app
          path: pc_port/build/macos/Silent Hill PC.dmg
          if-no-files-found: error
          retention-days: 90
