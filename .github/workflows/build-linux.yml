name: Build PC Port (Linux)

# Produces the Linux x64 binary of the PC port. CI only BUILDS it (the maintainer
# is still the sole publisher) — release-nightly.ps1 -AttachCrossPlatform pulls the
# artifact this run uploads and attaches it to the nightly release alongside the
# Windows build. The Windows launcher never consumes these files.

on:
  push:
    branches:
      - pc-port
    paths-ignore:
      - '**.md'
      - 'pc_port/launcher/**'
  workflow_dispatch:

jobs:
  build:
    # Only on our fork — never on Vatuu upstream (which has no PC port branch).
    if: github.repository == 'SlickAmogus/silent-hill-decomp'
    # 22.04 links against an older glibc than ubuntu-latest (24.04), so the binary
    # runs on a wider range of distros.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout (with PsyCross submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libsdl2-dev libopenal-dev libjpeg-dev \
            libgl1-mesa-dev libglu1-mesa-dev

      # The ffmpeg FMV fallback needs ffmpeg 6+ headers at build time. jammy only
      # ships 4.4, which predates AVChannelLayout/swr_alloc_set_opts2, so unpack
      # noble's -dev packages into a staging prefix rather than installing them
      # (installing noble runtime libs here would drag in a newer glibc, which is
      # exactly what pinning ubuntu-22.04 avoids). Headers only: ffmpeg is dlopen'd
      # at runtime, so nothing from these packages is linked into or shipped with
      # the binary. Without this the build still succeeds, just with the feature off.
      - name: Stage ffmpeg 6 headers (build-only, never linked or bundled)
        run: |
          set -euo pipefail
          FFDIR="$RUNNER_TEMP/ffmpeg-headers"
          mkdir -p "$FFDIR/debs" "$FFDIR/root"
          echo 'deb http://archive.ubuntu.com/ubuntu noble main universe' \
            | sudo tee /etc/apt/sources.list.d/noble-ffmpeg-headers.list >/dev/null
          sudo apt-get update \
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/noble-ffmpeg-headers.list \
            -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
          (cd "$FFDIR/debs" && apt-get download \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev)
          for deb in "$FFDIR"/debs/*.deb; do dpkg-deb -x "$deb" "$FFDIR/root"; done
          sudo rm -f /etc/apt/sources.list.d/noble-ffmpeg-headers.list
          # Repoint the staged .pc files at the staging prefix so pkg-config hands
          # CMake the right -I flags and the version it gates on.
          PCDIR="$FFDIR/root/usr/lib/x86_64-linux-gnu/pkgconfig"
          sed -i "s|^prefix=/usr\$|prefix=$FFDIR/root/usr|" "$PCDIR"/lib*.pc
          echo "PKG_CONFIG_PATH=$PCDIR" >> "$GITHUB_ENV"
          PKG_CONFIG_PATH="$PCDIR" pkg-config --modversion libavcodec libavutil

      - name: Build (build.sh -> Ninja + map .so overlays)
        run: |
          cd pc_port
          chmod +x build.sh
          ./build.sh

      - name: Stage release files
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/SHPC-linux-x64"
          mkdir -p "$STAGE/maps"
          cp pc_port/build/SilentHillPC "$STAGE/"
          cp pc_port/build/maps/*.so    "$STAGE/maps/"
          # Clean config template so a fresh install starts on defaults.
          cp pc_port/config.cfg "$STAGE/config.cfg"
          # Empty save dir so the game has somewhere to write.
          mkdir -p "$STAGE/gamedata/save"
          # Shipped runtime assets (pc_port/assets/ mirrors the game folder layout).
          cp -r pc_port/assets/. "$STAGE/"
          # Runtime note for users (SDL2/OpenAL are system libs, not bundled).
          cat > "$STAGE/README-linux.txt" <<'EOF'
          Silent Hill PC Port — Linux x64
          Requires the original disc image in gamedata/ (not included).
          Runtime dependencies (install via your package manager):
            SDL2, OpenAL (libopenal1), OpenGL drivers
            Debian/Ubuntu:  sudo apt install libsdl2-2.0-0 libopenal1
          Run:  ./SilentHillPC
          EOF
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/SHPC-linux-x64.tar.gz" SHPC-linux-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHPC-linux-x64
          path: ${{ runner.temp }}/SHPC-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 90
