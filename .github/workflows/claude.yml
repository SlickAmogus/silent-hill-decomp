name: Claude Code

# Mention @claude in an issue or PR comment (or in a new issue body/title) and the
# Claude GitHub App implements the change and opens/updates a PR.
# Auth: runs on a Claude subscription (Pro/Max) via an OAuth token — generate it with
# `claude setup-token` in a Claude Code terminal, then add it to the repo as the
# CLAUDE_CODE_OAUTH_TOKEN secret (Settings -> Secrets and variables -> Actions).
# No pay-per-use API key required.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only run when @claude is actually mentioned (so it doesn't fire on every comment).
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create branches / commit fixes
      pull-requests: write    # open and update PRs
      issues: write           # comment back on issues
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
